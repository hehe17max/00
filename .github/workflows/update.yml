name: Update peripheral product database

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peripheral-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      PERIPHERALDB_SCAN_MODE: fast

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Test product publication rules
        run: python -m unittest discover -s scripts/tests -v

      - name: Apply brand metadata and publication quality gate
        run: python scripts/upgrade_quality_v12.py

      - name: Run installation health check
        run: python scripts/health_check.py

      - name: Discover new peripheral brands
        run: python scripts/discover_brands.py
        timeout-minutes: 8

      - name: Import approved secondary feeds
        run: python scripts/import_secondary.py

      - name: Discover products and recheck official specs
        run: python -u scripts/update_data.py
        timeout-minutes: 25

      - name: Audit names, duplicates and unsupported products
        run: python scripts/audit_products.py

      - name: Validate database
        run: python scripts/validate_data.py

      - name: Commit discovery and database changes
        run: |
          git config user.name "peripheral-db-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: discover brands and update products"
          # Other commits can arrive during the scan. Rebase without forcing
          # or choosing a side: genuine data conflicts must remain visible.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
