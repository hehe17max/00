name: Update peripheral product database

on:
  schedule:
    - cron: '20 2 * * 1-6'
    - cron: '20 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      PERIPHERALDB_SCAN_MODE: ${{ github.event.schedule == '20 2 * * 0' && 'deep' || 'fast' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run installation health check
        run: python scripts/health_check.py

      - name: Discover new peripheral brands
        run: python scripts/discover_brands.py
        timeout-minutes: 8

      - name: Import approved secondary feeds
        run: python scripts/import_secondary.py

      - name: Discover products and recheck official specs
        run: python -u scripts/update_data.py
        timeout-minutes: 25

      - name: Validate database
        run: python scripts/validate_data.py

      - name: Commit discovery and database changes
        run: |
          git config user.name "peripheral-db-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: discover brands and update products"
          git push
