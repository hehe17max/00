<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeripheralDB｜全球外设产品参数库</title>
<meta name="description" content="键盘、鼠标、耳机等外设产品的多品牌参数搜索、筛选、核验与对比数据库">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="wrap hero">
<div><div class="eyebrow">PERIPHERALDB · RELEASE 1.1</div><h1>全球外设产品参数库</h1>
<p>官方优先 · 多来源核验 · 每日发现新品 · 参数筛选 · 最多20款对比</p></div>
<div class="status"><span class="dot"></span><span id="updated">读取数据中…</span></div>
</div></header>

<main class="wrap">
<section class="brandtool">
  <div>
    <span class="eyebrow">BRAND SEARCH & SUPPLEMENT</span>
    <h2>品牌搜索 / 联网补全</h2>
    <p>先搜索数据库中的品牌；需要补充时，可启动品牌定向联网扫描。</p>
  </div>
  <div class="brandtool-actions">
    <input id="brandSearch" type="search" placeholder="输入品牌，例如 VGN、AULA、Logitech G">
    <button id="brandLocalSearch">搜索品牌</button>
    <a id="brandSupplement" href="https://github.com/hehe17max/00/actions/workflows/supplement-brand.yml" target="_blank" rel="noopener">联网补全品牌 ↗</a>
  </div>
  <div id="brandSearchResult" class="brandsearchresult"></div>
</section>

<section class="toolbar">
  <input id="search" type="search" placeholder="搜索品牌、型号或参数…">
  <div class="filterrow">
    <select id="brandFilter"><option value="全部">全部品牌</option></select>
    <select id="catFilter"><option value="全部">全部品类</option></select>
    <select id="originFilter"><option value="全部">全部来源地区</option><option value="中国">中国品牌</option><option value="海外">海外品牌</option></select>
    <select id="verifyFilter"><option value="全部">全部核验状态</option><option value="official_verified">官方已核实</option><option value="official_discovered">官方已发现/待补</option><option value="conflict">存在冲突</option></select>
    <select id="keywordMode">
      <option value="single">关键词：单选</option>
      <option value="and">关键词：多选且全部匹配 AND</option>
      <option value="or">关键词：多选任一匹配 OR</option>
    </select>
    <select id="sort"><option value="brand">品牌 / 型号</option><option value="name">型号名称</option><option value="verified">核验度优先</option></select>
  </div>
  <div class="kwtitle"><span>快捷筛选关键词</span><button id="clearKeywords">清空关键词</button></div>
  <div id="quick" class="quick"></div>
</section>

<section class="metrics">
  <div><b id="count">0</b><span>当前结果</span></div>
  <div><b id="total">0</b><span>收录产品</span></div>
  <div><b id="brands">0</b><span>品牌</span></div>
  <div><b id="cats">0</b><span>品类</span></div>
  <div><b id="verifiedCount">0</b><span>官方已核实</span></div>
</section>

<section class="discoverypanel">
      <div>
        <span class="eyebrow">AUTO DISCOVERY</span>
        <b id="discoverySummary">正在读取品牌发现状态…</b>
        <small id="discoveryProvider"></small>
      </div>
      <button id="openCandidates">查看候选品牌</button>
    </section>
    <section id="grid" class="grid"></section>
<div id="empty" class="empty hidden">没有找到匹配产品。</div>
</main>

<div id="compareBar" class="comparebar hidden">
  <span>已选 <b id="compareCount">0</b>/20</span>
  <div id="compareNames"></div>
  <button id="clearCompare">清空</button><button id="doCompare" class="primary">参数对比</button>
</div>

<dialog id="detail"><button class="close" onclick="detail.close()">×</button><div id="detailBody"></div></dialog>
<dialog id="compareDialog"><button class="close" onclick="compareDialog.close()">×</button><div id="compareBody"></div></dialog>
<dialog id="candidateDialog"><button class="close" onclick="candidateDialog.close()">×</button><div id="candidateBody"></div></dialog>

<footer class="wrap"><p>官方页面为最高优先级；电商与第三方仅作为补充/交叉核验。若来源冲突，数据库保留冲突而不自动覆盖官方参数。</p></footer>
<script src="app.js"></script></body></html>
