<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeripheralDB｜全球外设产品参数库</title>
<meta name="description" content="键盘、鼠标、耳机等外设产品的多品牌参数搜索、筛选、核验与对比数据库">
<link rel="stylesheet" href="style.css?v=1.2.1"></head>
<body>
<header><div class="wrap hero">
<div><div class="eyebrow">PERIPHERALDB · RELEASE 1.4.0</div><h1 data-i18n="title">全球外设产品参数库</h1>
<p data-i18n="subtitle">中国官方中文数据优先 · 每30分钟自动更新 · 低可信度数据明确标注 · 最多20款对比</p></div>
<div class="hero-actions"><select id="languageSwitch" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select><div class="status"><span class="dot"></span><span id="updated">读取数据中…</span></div></div>
</div></header>

<main class="wrap">
<section class="brandtool">
  <div>
    <span class="eyebrow">QUICK SUPPLEMENT</span>
    <h2 data-i18n="brandToolTitle">品牌 / 产品快速补全</h2>
    <p data-i18n="brandToolDesc">输入品牌名先查数据库；缺少品牌或产品时，直接进入联网补全。</p>
  </div>
  <div class="brandtool-actions">
    <input id="brandSearch" type="search" placeholder="输入中文或英文品牌名" data-i18n-placeholder="brandPlaceholder">
    <button id="brandLocalSearch" data-i18n="searchBrand">查数据库</button>
    <a id="brandSupplement" href="https://github.com/hehe17max/00/actions/workflows/supplement-brand.yml" target="_blank" rel="noopener" data-i18n="supplementBrand">联网补全 ↗</a>
  </div>
  <div id="brandSearchResult" class="brandsearchresult"></div>
</section>

<section class="toolbar">
  <input id="search" type="search" placeholder="搜索品牌、型号或参数…" data-i18n-placeholder="searchPlaceholder">
  <div class="filterrow">
    <select id="brandFilter"><option value="全部" data-i18n="allBrands">全部品牌</option></select>
    <select id="catFilter"><option value="全部" data-i18n="allCategories">全部品类</option></select>
    <select id="originFilter"><option value="全部" data-i18n="allOrigins">全部来源地区</option><option value="中国" data-i18n="chinaBrands">中国品牌</option><option value="海外" data-i18n="overseasBrands">海外品牌</option></select>
    <select id="verifyFilter"><option value="全部" data-i18n="allVerification">全部核验状态</option><option value="official_verified" data-i18n="officialVerified">官方已核实</option><option value="official_discovered" data-i18n="officialDiscovered">官方已发现/待补</option><option value="legacy_review_required" data-i18n="legacyReview">历史数据待复核</option><option value="conflict" data-i18n="conflict">存在冲突</option></select>
    <select id="keywordMode">
      <option value="single" data-i18n="keywordSingle">关键词：单选</option>
      <option value="and" data-i18n="keywordAnd">关键词：多选且全部匹配 AND</option>
      <option value="or" data-i18n="keywordOr">关键词：多选任一匹配 OR</option>
    </select>
    <select id="sort"><option value="brand" data-i18n="sortBrand">品牌 / 型号</option><option value="name" data-i18n="sortName">型号名称</option><option value="verified" data-i18n="sortVerified">核验度优先</option></select>
  </div>
  <div class="kwtitle"><span data-i18n="quickFilters">快捷筛选关键词</span><button id="clearKeywords" data-i18n="clearKeywords">清空关键词</button></div>
  <div id="quick" class="quick"></div>
</section>

<section class="metrics">
  <div><b id="count">0</b><span data-i18n="results">当前结果</span></div>
  <div><b id="total">0</b><span data-i18n="products">收录产品</span></div>
  <div><b id="brands">0</b><span data-i18n="brands">品牌</span></div>
  <div><b id="cats">0</b><span data-i18n="categories">品类</span></div>
  <div><b id="verifiedCount">0</b><span data-i18n="officialVerified">官方已核实</span></div>
</section>

<section class="discoverypanel">
      <div>
        <span class="eyebrow">AUTO DISCOVERY</span>
        <b id="discoverySummary" data-i18n="loadingDiscovery">正在读取品牌发现状态…</b>
        <small id="discoveryProvider"></small>
      </div>
      <button id="openCandidates" data-i18n="viewCandidates">查看候选品牌</button>
    </section>
    <section id="grid" class="grid"></section>
<div id="empty" class="empty hidden" data-i18n="noResults">没有找到匹配产品。</div>
</main>

<div id="compareBar" class="comparebar hidden">
  <span><span data-i18n="selected">已选</span> <b id="compareCount">0</b>/20</span>
  <div id="compareNames"></div>
  <button id="clearCompare" data-i18n="clear">清空</button><button id="doCompare" class="primary" data-i18n="compare">参数对比</button>
</div>

<dialog id="detail"><button class="close" onclick="detail.close()">×</button><div id="detailBody"></div></dialog>
<dialog id="compareDialog"><button class="close" onclick="compareDialog.close()">×</button><div id="compareBody"></div></dialog>
<dialog id="candidateDialog"><button class="close" onclick="candidateDialog.close()">×</button><div id="candidateBody"></div></dialog>
<footer class="wrap"><p data-i18n="footer">中国大陆官方中文产品页优先。证据完整的数据标记为已核实；低可信度参数继续展示并注明“待核实”。</p></footer>
<script src="app.js?v=1.4.0"></script></body></html>
